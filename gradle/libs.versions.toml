[versions]
kotlin = "2.4.21"
serializationJson = "1.11.0"
dexlib2 = "3.0.10"
# DexKit：手机上本机适配和电脑上的一致性校验用同一个版本。
dexkit = "2.3.0"
# DexKit AAR 的 POM 依赖的 FlatBuffers（电脑上单独加；升级 DexKit 时一起核对）。
dexkitFlatbuffers = "23.5.26"
junit = "4.13.2"
# APK 签名校验（和 AGP 同版本）
apksig = "9.4.1"
snakeyamlEngine = "3.2"
# 读开源库官方 jar（开源库识别）
asm = "9.9.1"
# Hook 框架（只在编译 hooks 模块时用，compileOnly，不打进使用方）
libxposed = "102.0.0"
xposedApi = "82"
yukihookapi = "1.3.2"
ezxhelper = "2.2.1"
kavaref = "1.1.1"
# jadx 插件（compileOnly，jadx 自己提供）
jadx = "1.5.6"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version.ref = "dexlib2" }
dexkit-flatbuffers = { module = "com.google.flatbuffers:flatbuffers-java", version.ref = "dexkitFlatbuffers" }
junit = { module = "junit:junit", version.ref = "junit" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyamlEngine" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
xposed-api = { module = "de.robv.android.xposed:api", version.ref = "xposedApi" }
yukihookapi = { module = "com.highcapable.yukihookapi:api", version.ref = "yukihookapi" }
ezxhelper = { module = "com.github.kyuubiran:EzXHelper", version.ref = "ezxhelper" }
jadx-core = { module = "io.github.skylot:jadx-core", version.ref = "jadx" }
jadx-dex-input = { module = "io.github.skylot:jadx-dex-input", version.ref = "jadx" }
kavaref-core = { module = "com.highcapable.kavaref:kavaref-core", version.ref = "kavaref" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
