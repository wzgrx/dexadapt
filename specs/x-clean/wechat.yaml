# X-Clean 守卫族目标（初版）
# 每个 target = 未来 DetectGuard / ReportGuard 的一个挂钩点候选
# 纪律：matcher 只用 DexKit metadata（桌面安全）；allowFailure 显式标注跨版本不确定性
app: com.tencent.mm
label: x-clean-guard-family

targets:
  # ① Xposed 框架检测类（WeKit 同款 matcher 复刻；2026-10-11 在 8.0.79 已验证命中 com.tencent.mm.app.j3）
  - key: xposed-check-class
    type: class
    unique: true
    match:
      packages: [com.tencent.mm.app]
      strings_eq:
        - "de.robv.android.xposed.XposedBridge"
        - "com.zte.heartyservice.SCC.FrameworkBridge"

  # ② 检测类里的具体检测方法（未来 hookBefore → result=false 的目标）
  - key: xposed-check-method
    type: method
    in: xposed-check-class
    match:
      strings_eq: ["de.robv.android.xposed.XposedBridge"]

  # ③ 崩溃上报器引用（X 3.0 HkCrashUpload 的对应物；crashuploader.a 字段级证据）
  - key: crashuploader-ref
    type: class
    allowFailure: true
    match:
      strings_contains: ["crashuploader"]

  # ④ Tinker 热修入口引用（X 3.0 HkTinker 族对应物）
  - key: tinker-application-ref
    type: class
    allowFailure: true
    match:
      strings_contains: ["com.tencent.tinker.loader.app.TinkerApplication"]

  # ⑤ Root 信号面（探索性，待矩阵确认后收敛为正式目标）
  - key: root-signal-magisk
    type: class
    allowFailure: true
    match:
      strings_contains_ignore_case: ["magisk"]

  - key: root-signal-su-path
    type: class
    allowFailure: true
    match:
      strings_contains: ["/system/bin/su"]
